site_name: 8 Cuidados para Preparar as Compras Públicas para a Reforma Tributária

theme:
  name: readthedocs

markdown_extensions:
  - md_in_html
  - admonition

nav:
  - Início: index.md
  - 1. Planejamento, Pesquisa e Propostas: 01-planejamento.md
  - 2. Contratos e Atas Vigentes: 02-contratos.md
  - 3. Gestão, Execução e Pagamentos: 03-gestao.md
  - Versão Completa: manual-completo.md

# Configuração dos estilos e scripts customizados
extra_css:
  - custom.css
  - css/extra.css

